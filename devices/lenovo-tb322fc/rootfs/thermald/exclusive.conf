[Service]
# Upstream ships ExecStart=/usr/bin/thermald --systemd --dbus-enable --adaptive.
# Replace it: run thermald as the exclusive thermal controller so it switches
# the kernel thermal zones to the user_space governor and takes over the
# cpufreq/devfreq cooling devices.  Without --exclusive-control the in-kernel
# step_wise governor keeps writing cur_state and overrides thermald.
#
# --adaptive is deliberately NOT used: the adaptive engine disables the
# thermal-conf.xml parser (parser_disabled=true), which would ignore our
# /etc/thermald/thermal-conf.xml.  --exclusive-control requires
# CONFIG_THERMAL_GOV_USER_SPACE=y in the kernel (configs/kernel.config).
ExecStart=
ExecStart=/usr/bin/thermald --systemd --dbus-enable --exclusive-control
